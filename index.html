<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Desktop Home Page</title>
    <body>

        <main>

        </main>

        <div class="rectangle"></div>

        
        <!--Chrome Button below--> 
        <div class="chrome-button">
        <button class="chrome-button" onclick="window.location.href='code.html'">
            <img class="chrome-image" src="Icons/crome-icon.png" alt="chrome">
        </button>
            </div>
        <!--Search engine button below-->
        <div class="search-button">
            <button class="search-button">
                <img class="search-image" src="Icons/searchbar-icon.png" alt="searchbar icon">
            </button>
        </div>
        <!--Settings Icon-->
        <div class="Settings-button">
            <button class="settings-button">
                <img class="settings-image" src="Icons/setting-icon.png" alt="settings icon">
            </button>
        </div>
        <!--Folder Button-->
        <div class="folder-button">
            <button class="folder-button">
                <img class="folder-image" src="Icons/folder-icon.png" alt="folder icon">
            </button>
        </div>
        <!--Notes Button-->
        <div class="notes-button">
            <button class="notes-button">
                <img class="notes-image" src="Icons/notes-icon.png" alt="Notes icon">
            </button>
        </div>
        <!--VS code Button-->
        <div class="code-button">
            <button class="code-button">
                <img class="code-image" src="Icons/vs-icon.png" alt="VS code icon">
            </button>
        </div>
        <!--Mail Button-->
        <div class="mail-button">
            <button class="mail-button">
                <img class="mail-image" src="Icons/mail-icon.png" alt="mail icon">
            </button>
        </div>
        <!--Spotify Icon-->
        <div class="spotify-button">
            <button class="spotify-button">
                <img class="spotify-image" src="Icons/spotify-icon.png" alt="spotify icon">
            </button>
        </div>
        <!--Clock Code-->

        <div class="top-left">
        <div class="clock-container">
            <h1>Welcome to my desktop page!</h1>
            <p>Feel free to click on any icon in the taskbar :)</p>
            <div id="clock">
                <span id="hours">00</span>:
                <span id="minutes">00</span>:
                <span id="seconds">00</span>
                <span id="ampm">AM</span>
            </div>
        </div>
        </div>

        <!--Floaters-->
        <div class="floater-folder">
            <button class="floater-folder">
                <img class="float-image" src="folder-floater.png" alt="folder icon">
                <p>Folder</p>
            </button>
        </div>

        <div class="code-floater">
            <button class="code-floater">
                <img class="floater-image" src="code-floater.png" alt="code floater icon">
                <p>VS Code</p>
            </button>
        </div>

        <!--Second Clock for taskbar-->
        <div class="switch-container">
            <div id="clocks">
            <span id="hours2">00</span>:
            <span id="minutes2">00</span>:
            <span id="seconds2">00</span>
            <span id="ampm2">AM</span>
            </div>
        </div>

        <!--tray icons-->
        <div class="tray-container">
            <img class="tray" src="trays.png" alt="system defaults">
        </div>
        <script src="script.js"></script>
    </body>
</html>
