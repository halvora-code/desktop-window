<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Notepad</title>
        <link rel="stylesheet" href="notes.css">
    </head>
    <body>
        <h1>Type a thought in the box below!</h1>
        <div class="notepad">
            <textarea placeholder="Start writing..."></textarea>
        </div>

        <div class="exit-button">
            <button class="exit-button" onclick="window.location.href='index.html'">
                <img class="exit-image" src="exit-button.png" alt="exit button">
            </button>
        </div>
    </body>
</html>
